name: Publish PyPI

# First-time setup: https://pypi.org/manage/account/publishing/
# Add trusted publisher: Owner Procoder1234556, repo NoVibeLeaks, workflow publish-pypi.yml
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Upload novibeleaks to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/novibeleaks/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        working-directory: secmcp
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: secmcp/dist/
