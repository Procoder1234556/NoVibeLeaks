name: SecMCP CI

on:
  push:
    paths:
      - "secmcp/**"
      - "vendor/mcp-guard/**"
      - ".github/workflows/secmcp-ci.yml"
  pull_request:
    paths:
      - "secmcp/**"
      - "vendor/mcp-guard/**"
      - ".github/workflows/secmcp-ci.yml"

jobs:
  prompt-k-parity:
    name: Prompt K (mcp-guard parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SecMCP + mcp-guard + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e vendor/mcp-guard
          pip install -e "secmcp[dev]"

      - name: Run parity acceptance tests
        run: python -m pytest tests/test_parity_mcp_guard.py -v
        working-directory: secmcp
