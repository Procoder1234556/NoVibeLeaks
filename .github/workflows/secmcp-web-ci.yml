name: SecMCP Web CI

on:
  push:
    paths:
      - "secmcp-web/**"
      - "secmcp/secmcp/web_payload.py"
      - "scripts/scan_snippet.py"
      - "secmcp/**"
      - ".github/workflows/secmcp-web-ci.yml"
  pull_request:
    paths:
      - "secmcp-web/**"
      - "secmcp/secmcp/web_payload.py"
      - "scripts/scan_snippet.py"
      - "secmcp/**"
      - ".github/workflows/secmcp-web-ci.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secmcp-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: secmcp-web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python scanner
        run: pip install -e "../secmcp[dev]"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          SECMCP_REPO_ROOT: ${{ github.workspace }}

      - name: Playwright smoke
        run: npm run test:e2e
        env:
          SECMCP_REPO_ROOT: ${{ github.workspace }}
          CI: true
