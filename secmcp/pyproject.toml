[project]
name = "novibeleaks"
version = "0.1.0"
description = "NoVibeLeaks — MCP security: secrets, API keys, and vibe-coding anti-patterns"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NoVibeLeaks Contributors" }]
keywords = ["mcp", "security", "secrets", "cursor", "model-context-protocol", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp[cli]>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Procoder1234556/NoVibeLeaks"
Repository = "https://github.com/Procoder1234556/NoVibeLeaks"
Issues = "https://github.com/Procoder1234556/NoVibeLeaks/issues"
Documentation = "https://github.com/Procoder1234556/NoVibeLeaks#readme"

[project.scripts]
novibeleaks = "server:main"
secmcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "secmcp", "rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
